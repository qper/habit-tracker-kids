<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport with iOS safe area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ========== PWA / iOS ========== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Привычки" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Привычки" />

    <!-- Theme colors -->
    <meta name="theme-color" content="#FF6B6B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a0808" media="(prefers-color-scheme: dark)" />

    <!-- SEO -->
    <meta name="description" content="Трекер привычек для детей — отслеживай прогресс каждый день!" />
    <meta name="keywords" content="привычки, трекер, дети, прогресс, streak" />

    <!-- ========== Apple Touch Icons ========== -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png" />

    <!-- Standard favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />

    <!-- ========== Apple Splash Screens ========== -->
    <!-- iPhone 14/15 Pro Max (430×932 @3x → 1290×2796) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- iPhone 14 Pro / 15 Pro (393×852 @3x → 1179×2556) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-1170x2532.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- iPhone 14 / 13 / 12 (390×844 @3x → 1170×2532) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- iPhone 13 mini / 12 mini / X / Xs (375×812 @3x → 1125×2436) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <!-- iPhone 11 / XR (414×896 @2x → 828×1792) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- iPhone 8 / SE 2nd (375×667 @2x → 750×1334) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- iPad (768×1024 @2x → 1536×2048) -->
    <link rel="apple-touch-startup-image"
      href="splash/splash-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- ========== Fonts ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&display=swap"
      rel="stylesheet"
    />

    <title>Мои Привычки</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
